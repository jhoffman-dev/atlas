<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: {{t.surface}}; color: {{t.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; font-size: 13px;">
<svg width="0" height="0" style="position: absolute;" aria-hidden="true">
<symbol id="tb-table" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M4 10h16M10 10v9"></path></g></symbol>
<symbol id="tb-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
<symbol id="tb-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
<symbol id="tb-sort" viewBox="0 0 24 24"><path d="M8 5v14M5 16l3 3 3-3M16 19V5M13 8l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
<symbol id="tb-group" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4.5" width="16" height="6" rx="1.5"></rect><rect x="4" y="13.5" width="16" height="6" rx="1.5"></rect></g></symbol>
<symbol id="tb-star" viewBox="0 0 24 24"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4l-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></symbol>
<symbol id="tb-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="6" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle></g></symbol>
<symbol id="tb-chev" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
<symbol id="tb-up" viewBox="0 0 24 24"><path d="M12 18V6M7 11l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
</svg>

<dc-import name="Sidebar" theme="{{theme}}" active="task-table" hint-size="224px,900px"></dc-import>

<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">

<header style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 20px; border-bottom: 1px solid {{t.line}};">
<svg width="15" height="15" style="color: {{t.ink3}};" aria-hidden="true"><use href="#tb-table"></use></svg>
<span style="color: {{t.ink3}};">Views</span>
<span style="color: {{t.ink3}};">/</span>
<span style="font-weight: 500;">All tasks</span>
<span style="margin-left: 6px; font-size: 12px; color: {{t.ink3}}; font-variant-numeric: tabular-nums;">186 tasks</span>
<span style="flex-grow: 1;"></span>
<span style="font-size: 12px; color: {{t.ink3}}; margin-right: 6px;">Saved</span>
<button type="button" aria-label="Add to favorites" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink3}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" aria-hidden="true"><use href="#tb-star"></use></svg></button>
<button type="button" aria-label="More" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink3}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" aria-hidden="true"><use href="#tb-more"></use></svg></button>
</header>

<div style="height: 44px; flex-shrink: 0; display: flex; align-items: stretch; gap: 2px; padding: 0 12px 0 14px; border-bottom: 1px solid {{t.line}};">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="6">
<button type="button" aria-pressed="{{tab.pressed}}" style="border: 0; border-bottom: 2px solid {{tab.bar}}; margin-bottom: -1px; background: transparent; padding: 2px 8px 0; font: inherit; font-size: 13px; font-weight: {{tab.weight}}; color: {{tab.ink}}; cursor: pointer;">{{tab.label}}</button>
</sc-for>
<span style="flex-grow: 1;"></span>
<div style="display: flex; align-items: center; gap: 2px;">
<button type="button" style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink2}}; font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: pointer;"><svg width="14" height="14" aria-hidden="true"><use href="#tb-filter"></use></svg>Filter</button>
<button type="button" style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink2}}; font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: pointer;"><svg width="14" height="14" aria-hidden="true"><use href="#tb-sort"></use></svg>Phase</button>
<button type="button" style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink2}}; font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: pointer;"><svg width="14" height="14" aria-hidden="true"><use href="#tb-group"></use></svg>Status</button>
<span style="width: 1px; height: 16px; background: {{t.line}}; margin: 0 6px;"></span>
<button type="button" style="height: 28px; border: 0; border-radius: 6px; background: {{t.btn}}; color: {{t.btnInk}}; font: inherit; font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 5px; padding: 0 10px 0 8px; cursor: pointer;"><svg width="14" height="14" aria-hidden="true"><use href="#tb-plus"></use></svg>New task</button>
</div>
</div>

<div role="table" aria-label="All tasks" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
<div role="row" style="height: 32px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0, 1fr) 120px 72px 84px 150px 96px; align-items: center; padding: 0 20px 0 44px; border-bottom: 1px solid {{t.line}}; font-size: 12px; font-weight: 500; color: {{t.ink3}};">
<span role="columnheader">Name</span>
<span role="columnheader">Status</span>
<span role="columnheader" style="display: flex; align-items: center; gap: 3px; color: {{t.ink2}};">Phase<svg width="11" height="11" aria-hidden="true"><use href="#tb-up"></use></svg></span>
<span role="columnheader">Estimate</span>
<span role="columnheader">Role</span>
<span role="columnheader">Source</span>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div role="rowgroup" style="display: flex; flex-direction: column; flex-shrink: 0;">
<div role="row" style="height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 20px 0 18px; background: {{t.well}}; border-bottom: 1px solid {{t.line}};">
<svg width="13" height="13" style="color: {{t.ink3}};" aria-hidden="true"><use href="#tb-chev"></use></svg>
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{g.dot}}; margin-left: 4px;"></span>
<span style="font-size: 12.5px; font-weight: 600;">{{g.label}}</span>
<span style="font-size: 12px; color: {{t.ink3}}; font-variant-numeric: tabular-nums;">{{g.count}}</span>
</div>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
<div role="row" style="height: 34px; display: grid; grid-template-columns: minmax(0, 1fr) 120px 72px 84px 150px 96px; align-items: center; padding: 0 20px 0 44px; border-bottom: 1px solid {{t.line}}; background: {{r.bg}};">
<span role="cell" style="padding-right: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{r.ink}};">{{r.name}}</span>
<span role="cell" style="display: flex; align-items: center;"><span style="height: 20px; display: inline-flex; align-items: center; gap: 6px; padding: 0 7px; border-radius: 4px; background: {{g.tint}}; color: {{g.pink}}; font-size: 12px; font-weight: 500;"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{g.dot}};"></span>{{g.label}}</span></span>
<span role="cell" style="font-size: 12.5px; color: {{t.ink2}}; font-variant-numeric: tabular-nums;">{{r.phase}}</span>
<span role="cell" style="font-size: 12.5px; color: {{t.ink2}}; font-variant-numeric: tabular-nums;">{{r.est}}</span>
<span role="cell" style="font-size: 12.5px; color: {{t.ink2}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.role}}</span>
<span role="cell" style="font-size: 12.5px; color: {{t.ink2}};">{{r.source}}</span>
</div>
</sc-for>
<sc-if value="{{g.more}}" hint-placeholder-val="{{false}}">
<div role="row" style="height: 30px; display: flex; align-items: center; padding: 0 20px 0 44px; border-bottom: 1px solid {{t.line}};">
<button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; font-size: 12px; color: {{t.ink3}}; cursor: pointer;">{{g.more}}</button>
</div>
</sc-if>
</div>
</sc-for>
</div>

<footer style="height: 30px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-top: 1px solid {{t.line}}; font-size: 12px; color: {{t.ink3}}; font-variant-numeric: tabular-nums;">
<span>186 tasks</span>
<span>174 done</span>
<span>10 backlog</span>
<span>2 in review</span>
<span style="flex-grow: 1;"></span>
<span>Grouped by status · sorted by phase</span>
</footer>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  tokens(theme) {
    if (theme === "dark") {
      return { surface: "#18181B", well: "#1D1D21", ink: "#EDEDEF", ink2: "#B4B4BC", ink3: "#8E8E98", line: "#2A2A2F", hover: "#222227", btn: "rgba(126,162,221,0.18)", btnInk: "#B5CBF0",
        dot: { backlog: "#7C7C86", review: "#A595E3", done: "#7DBF93" },
        tint: { backlog: "rgba(161,161,170,0.14)", review: "rgba(165,149,227,0.16)", done: "rgba(125,191,147,0.16)" },
        pink: { backlog: "#C4C4CC", review: "#CBC1F2", done: "#A9D9B8" } };
    }
    return { surface: "#FFFFFF", well: "#F8F8F9", ink: "#18181B", ink2: "#52525B", ink3: "#6B6B73", line: "#ECECEF", hover: "#F4F4F6", btn: "#E3ECFB", btnInk: "#23457E",
      dot: { backlog: "#A1A1AA", review: "#A595E3", done: "#7DBF93" },
      tint: { backlog: "#F1F1F3", review: "#EFEBFB", done: "#E6F3EA" },
      pink: { backlog: "#52525B", review: "#4E3F8F", done: "#2F6B45" } };
  }
  renderVals() {
    const theme = this.props.theme ?? "light";
    const t = this.tokens(theme);
    const tabs = ["Board", "All tasks", "Inbox", "Today", "Calendar", "Roadmap"].map((label, i) => ({
      label, pressed: i === 1 ? "true" : "false", bar: i === 1 ? t.ink : "transparent", ink: i === 1 ? t.ink : t.ink2, weight: i === 1 ? "500" : "400",
    }));
    const row = (name, phase, est, role, source, hover) => ({
      name, phase: phase ?? "", est: est || "", role: role || "", source: source || "", ink: t.ink, bg: hover ? t.hover : "transparent",
    });
    const group = (key, label, count, rows, more) => ({ label, count: String(count), dot: t.dot[key], tint: t.tint[key], pink: t.pink[key], rows, more: more || "" });
    const groups = [
      group("review", "Review", 2, [
        row("Phase 16 — The look, rebuilt", "16", "1w"),
        row("The UI doesn’t look good, or close to the reference images", "", "", "", "You"),
      ]),
      group("backlog", "Backlog", 10, [
        row("addDays hands back its input when it cannot move, and says nothing", "14", "1h", "Bug fixer", "", true),
        row("Cmd+N and Shift+Cmd+D still fire behind an open palette", "14", "1h", "Bug fixer"),
        row("Leftovers from A15-02: templates in views, short query pages, create races", "15", "3h"),
        row("Drag to resize and reorder widgets"),
        row("new-note.spec reads the file once instead of waiting for it"),
      ], "Show 5 more"),
      group("done", "Done", 174, [
        row("Install Rust toolchain + Xcode CLT", "0", "30m"),
        row("pnpm workspace + package skeleton", "0", "1h"),
        row("Tauri v2 + React + Vite shell", "0", "2h"),
        row("Test + lint + typecheck gate", "0", "1h30"),
        row("CI workflow + COVERAGE.md", "0", "1h"),
        row("VaultPort + domain vault model", "1", "2h"),
        row("Tauri fs adapter (scoped read)", "1", "3h"),
        row("Folder picker + persisted vault choice", "1", "1h30"),
        row("niceTicks never returns for a max too small for a step", "13", "1h", "Adversarial tester"),
        row("A slice narrower than its gap is painted back across its neighbour", "13", "2h", "Adversarial tester"),
        row("bug: spacing between task list items is double what it should be", "", "", "", "You"),
        row("bug: after the ‘/’ command, the cursor runs one character in front of the letters", "", "", "", "You"),
        row("feature: makes sidebar collapsible", "", "", "", "You"),
        row("bug: edits made to a document aren’t saving", "", "", "", "You"),
      ], "Show 160 more"),
    ];
    return { theme, t, tabs, groups };
  }
}
</script>
</body>
</html>
