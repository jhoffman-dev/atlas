<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: {{t.surface}}; color: {{t.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; font-size: 13px;">
<svg width="0" height="0" style="position: absolute;" aria-hidden="true">
<symbol id="b-board" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4.5" y="5" width="4" height="14" rx="1"></rect><rect x="10.5" y="5" width="4" height="9" rx="1"></rect><rect x="16.5" y="5" width="3.5" height="6" rx="1"></rect></g></symbol>
<symbol id="b-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
<symbol id="b-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
<symbol id="b-sort" viewBox="0 0 24 24"><path d="M8 5v14M5 16l3 3 3-3M16 19V5M13 8l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
<symbol id="b-group" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4.5" width="16" height="6" rx="1.5"></rect><rect x="4" y="13.5" width="16" height="6" rx="1.5"></rect></g></symbol>
<symbol id="b-star" viewBox="0 0 24 24"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4l-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></symbol>
<symbol id="b-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="6" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle></g></symbol>
<symbol id="b-done" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.3 12.3l2.5 2.5 4.9-5.2"></path></g></symbol>
</svg>

<dc-import name="Sidebar" theme="{{theme}}" active="task-board" hint-size="224px,900px"></dc-import>

<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">

<header style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 20px; border-bottom: 1px solid {{t.line}};">
<svg width="15" height="15" style="color: {{t.ink3}};" aria-hidden="true"><use href="#b-board"></use></svg>
<span style="color: {{t.ink3}};">Views</span>
<span style="color: {{t.ink3}};">/</span>
<span style="font-weight: 500;">Board</span>
<span style="margin-left: 6px; font-size: 12px; color: {{t.ink3}}; font-variant-numeric: tabular-nums;">186 tasks</span>
<span style="flex-grow: 1;"></span>
<span style="font-size: 12px; color: {{t.ink3}}; margin-right: 6px;">Saved</span>
<button type="button" aria-label="Add to favorites" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink3}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" aria-hidden="true"><use href="#b-star"></use></svg></button>
<button type="button" aria-label="More" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink3}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" aria-hidden="true"><use href="#b-more"></use></svg></button>
</header>

<div style="height: 44px; flex-shrink: 0; display: flex; align-items: stretch; gap: 2px; padding: 0 12px 0 14px; border-bottom: 1px solid {{t.line}};">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="6">
<button type="button" aria-pressed="{{tab.pressed}}" style="border: 0; border-bottom: 2px solid {{tab.bar}}; margin-bottom: -1px; background: transparent; padding: 2px 8px 0; font: inherit; font-size: 13px; font-weight: {{tab.weight}}; color: {{tab.ink}}; cursor: pointer;">{{tab.label}}</button>
</sc-for>
<span style="flex-grow: 1;"></span>
<div style="display: flex; align-items: center; gap: 2px;">
<button type="button" style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink2}}; font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: pointer;"><svg width="14" height="14" aria-hidden="true"><use href="#b-filter"></use></svg>Filter</button>
<button type="button" style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink2}}; font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: pointer;"><svg width="14" height="14" aria-hidden="true"><use href="#b-sort"></use></svg>Sort</button>
<button type="button" style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink2}}; font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: pointer;"><svg width="14" height="14" aria-hidden="true"><use href="#b-group"></use></svg>Status</button>
<span style="width: 1px; height: 16px; background: {{t.line}}; margin: 0 6px;"></span>
<button type="button" style="height: 28px; border: 0; border-radius: 6px; background: {{t.btn}}; color: {{t.btnInk}}; font: inherit; font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 5px; padding: 0 10px 0 8px; cursor: pointer;"><svg width="14" height="14" aria-hidden="true"><use href="#b-plus"></use></svg>New task</button>
</div>
</div>

<div style="flex-grow: 1; min-height: 0; display: flex; gap: 8px; padding: 12px 16px 0; overflow: hidden;">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="5">
<section aria-label="{{col.label}}" style="flex: {{col.flex}}; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 0 4px 4px; background: {{t.well}}; overflow: hidden;">
<div style="height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 7px; padding: 0 4px 0 6px;">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{col.dot}};"></span>
<span style="font-size: 12.5px; font-weight: 600;">{{col.label}}</span>
<span style="font-size: 12px; color: {{t.ink3}}; font-variant-numeric: tabular-nums;">{{col.count}}</span>
<span style="flex-grow: 1;"></span>
<button type="button" aria-label="Add to {{col.label}}" style="width: 22px; height: 22px; border: 0; border-radius: 5px; background: transparent; color: {{t.ink3}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="14" height="14" aria-hidden="true"><use href="#b-plus"></use></svg></button>
</div>
<sc-for list="{{col.cards}}" as="card" hint-placeholder-count="3">
<article style="flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; padding: 8px 10px 9px; background: {{t.surface}}; border: 1px solid {{t.line}};">
<div style="display: flex; gap: 6px; align-items: flex-start;">
<sc-if value="{{card.done}}" hint-placeholder-val="{{false}}">
<svg width="14" height="14" style="flex-shrink: 0; margin-top: 2px; color: {{t.doneInk}};" role="img" aria-label="Done"><use href="#b-done"></use></svg>
</sc-if>
<h3 style="margin: 0; font-size: 13px; font-weight: 500; line-height: 1.38; color: {{card.titleInk}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{card.title}}</h3>
</div>
<sc-if value="{{card.summary}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 12px; line-height: 1.4; color: {{t.ink3}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{card.summary}}</p>
</sc-if>
<sc-if value="{{card.hasMeta}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; color: {{t.ink3}}; white-space: nowrap; overflow: hidden;">
<sc-for list="{{card.meta}}" as="m" hint-placeholder-count="3">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="color: {{t.line2}};">·</span></sc-if>
<span style="font-variant-numeric: tabular-nums;">{{m.text}}</span>
</sc-for>
</div>
</sc-if>
</article>
</sc-for>
<sc-if value="{{col.empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 4px 6px; font-size: 12px; color: {{t.ink3}};">No tasks</p>
</sc-if>
<sc-if value="{{col.more}}" hint-placeholder-val="{{false}}">
<button type="button" style="flex-shrink: 0; height: 28px; border: 0; border-radius: 5px; background: transparent; color: {{t.ink3}}; font: inherit; font-size: 12px; text-align: left; padding: 0 6px; cursor: pointer;">{{col.more}}</button>
</sc-if>
</section>
</sc-for>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  tokens(theme) {
    if (theme === "dark") {
      return { bg: "#111113", surface: "#18181B", well: "#1D1D21", ink: "#EDEDEF", ink2: "#B4B4BC", ink3: "#8E8E98", line: "#2A2A2F", line2: "#4A4A52", btn: "rgba(126,162,221,0.18)", btnInk: "#B5CBF0", doneInk: "#7DBF93",
        dot: { backlog: "#7C7C86", next: "#7EA2DD", doing: "#DDA54E", review: "#A595E3", done: "#7DBF93" } };
    }
    return { bg: "#F6F6F7", surface: "#FFFFFF", well: "#F6F6F7", ink: "#18181B", ink2: "#52525B", ink3: "#6B6B73", line: "#E6E6E9", line2: "#C4C4CA", btn: "#E3ECFB", btnInk: "#23457E", doneInk: "#3F8A5A",
      dot: { backlog: "#A1A1AA", next: "#7EA2DD", doing: "#DDA54E", review: "#A595E3", done: "#7DBF93" } };
  }
  renderVals() {
    const theme = this.props.theme ?? "light";
    const t = this.tokens(theme);
    const tabs = ["Board", "All tasks", "Inbox", "Today", "Calendar", "Roadmap"].map((label, i) => ({
      label, pressed: i === 0 ? "true" : "false", bar: i === 0 ? t.ink : "transparent", ink: i === 0 ? t.ink : t.ink2, weight: i === 0 ? "500" : "400",
    }));
    const card = (title, summary, meta, done) => ({
      title, summary: summary || "", done: !!done, titleInk: done ? t.ink2 : t.ink,
      hasMeta: meta.length > 0, meta: meta.map((text, i) => ({ text, sep: i > 0 })),
    });
    const col = (key, label, count, cards, more) => ({
      label, count: String(count), dot: t.dot[key], cards, empty: cards.length === 0, more: more || "",
      flex: "1 1 0",
    });
    const columns = [
      col("backlog", "Backlog", 10, [
        card("addDays hands back its input when it cannot move, and says nothing", "A14-06 found a timeline bar that shrank at the end of time", ["P14", "Bug fixer", "1h"]),
        card("Cmd+N and Shift+Cmd+D still fire behind an open palette", "The one-overlay rule (apps/desktop/src/overlay.ts)…", ["P14", "Bug fixer", "1h"]),
        card("Leftovers from A15-02: templates in views, short query pages, create races", "In-app views, dashboards and aggregates include…", ["A15-03", "P15", "3h"]),
        card("Drag to resize and reorder widgets", "", []),
        card("new-note.spec reads the file once instead of waiting for it", "", []),
      ], "5 more"),
      col("next", "Next", 0, []),
      col("doing", "Doing", 0, []),
      col("review", "Review", 2, [
        card("Phase 16 — The look, rebuilt", "James, 2026-09-22, on the mockup: “go ahead and rebuild…”", ["P16", "1w"]),
        card("The UI doesn’t look good, or close to the reference images", "James, 2026-09-22: “When I get back home, I will assess…”", ["From you"]),
      ]),
      col("done", "Done", 174, [
        card("niceTicks never returns for a max too small for a step", "", ["P13", "Adversarial tester", "1h"], true),
        card("A slice narrower than its gap is painted back across its neighbour", "", ["P13", "Adversarial tester", "2h"], true),
        card("Open-in-pane silently opens in a different pane when that pane is gone", "", ["P13"], true),
        card("Prove it end to end, and try to break it", "", ["P15", "1d"], true),
        card("The MCP server, apps/mcp", "", ["P15", "1d"], true),
        card("Wire the bridge, and a Settings panel to turn it on", "", ["P15"], true),
        card("bug: edits made to a document aren’t saving", "", ["From you"], true),
        card("feature: makes sidebar collapsible", "", ["From you"], true),
      ], "166 more"),
    ];
    return { theme, t, tabs, columns };
  }
}
</script>
</body>
</html>
