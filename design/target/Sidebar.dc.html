<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Atlas" style="width: 224px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; padding: 8px 8px 10px; background: {{t.bg}}; border-right: 1px solid {{t.line}}; color: {{t.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; font-size: 13px; overflow: hidden;">
<svg width="0" height="0" style="position: absolute;" aria-hidden="true">
<symbol id="s-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></g></symbol>
<symbol id="s-today" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></g></symbol>
<symbol id="s-inbox" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2.5-7.5h11L20 13v5.5H4z"></path><path d="M4 13h4.5l1 2h5l1-2H20"></path></g></symbol>
<symbol id="s-review" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2"></rect><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4M9 14.5l2 2 4-4"></path></g></symbol>
<symbol id="s-graph" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="2.2"></circle><circle cx="18" cy="7" r="2.2"></circle><circle cx="11" cy="18" r="2.2"></circle><path d="M8 7l8 0M7 8l3 8M17 9l-5 7"></path></g></symbol>
<symbol id="s-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 4h7l9 9-7 7-9-9z"></path><circle cx="8.5" cy="8.5" r="1.3"></circle></g></symbol>
<symbol id="s-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></symbol>
<symbol id="s-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
<symbol id="s-template" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2.2"><rect x="4.5" y="4.5" width="15" height="15" rx="2"></rect></g></symbol>
<symbol id="s-terms" viewBox="0 0 24 24"><path d="M3.5 18L8 6l4.5 12M5.2 14h5.6M15 18v-5.5a2.5 2.5 0 0 1 5 0V18M15 15.5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
<symbol id="s-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2"></rect><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"></path></g></symbol>
<symbol id="s-company" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V5h9v15M14 9h5v11M3 20h18M8 8.5h3M8 12h3M8 15.5h3"></path></g></symbol>
<symbol id="s-person" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"></path></g></symbol>
<symbol id="s-task" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="3"></rect><path d="M8.5 12.2l2.4 2.4 4.6-5"></path></g></symbol>
<symbol id="s-table" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M4 10h16M10 10v9"></path></g></symbol>
<symbol id="s-gallery" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></g></symbol>
<symbol id="s-list" viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.5M4.5 12h.5M4.5 17h.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></symbol>
<symbol id="s-board" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="5" width="4" height="14" rx="1"></rect><rect x="10.5" y="5" width="4" height="9" rx="1"></rect><rect x="16.5" y="5" width="3.5" height="6" rx="1"></rect></g></symbol>
<symbol id="s-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 18v-6M11 18V7M16 18v-9M4 20.5h16"></path></g></symbol>
<symbol id="s-folder" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path></g></symbol>
<symbol id="s-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"></path></g></symbol>
<symbol id="s-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
<symbol id="s-sidebar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M10 5v14"></path></g></symbol>
<symbol id="s-chev" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
<symbol id="s-moon" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></symbol>
<symbol id="s-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.7 1.3A3.4 3.4 0 0 0 7 18z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></symbol>
</svg>

<div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 2px 0 8px; margin-bottom: 4px;">
<span style="width: 20px; height: 20px; border-radius: 5px; background: {{t.ink}}; color: {{t.surface}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;">A</span>
<span style="font-size: 13px; font-weight: 600;">Atlas Vault</span>
<svg width="12" height="12" style="color: {{t.ink3}};" aria-hidden="true"><use href="#s-chev"></use></svg>
<span style="flex-grow: 1;"></span>
<button type="button" aria-label="New note" style="width: 26px; height: 26px; border: 0; border-radius: 5px; background: transparent; color: {{t.ink3}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" aria-hidden="true"><use href="#s-plus"></use></svg></button>
<button type="button" aria-label="Hide sidebar" style="width: 26px; height: 26px; border: 0; border-radius: 5px; background: transparent; color: {{t.ink3}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" aria-hidden="true"><use href="#s-sidebar"></use></svg></button>
</div>

<div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="6">
<div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 1px; margin-bottom: 6px;">
<sc-if value="{{sec.label}}" hint-placeholder-val="{{true}}">
<div style="height: 26px; display: flex; align-items: flex-end; padding: 0 8px 4px; font-size: 11.5px; font-weight: 500; color: {{t.ink3}};">{{sec.label}}</div>
</sc-if>
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">
<button type="button" style="height: 28px; border: 0; border-radius: 5px; background: {{it.bg}}; color: {{it.ink}}; font: inherit; font-size: 13px; font-weight: {{it.weight}}; display: flex; align-items: center; gap: 8px; padding: 0 8px; cursor: pointer; text-align: left;">
<svg width="15" height="15" style="color: {{it.iconInk}}; flex-shrink: 0;" aria-hidden="true"><use href="#s-{{it.icon}}"></use></svg>
<span style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{it.label}}</span>
<span style="font-size: 12px; color: {{t.ink3}}; font-variant-numeric: tabular-nums;">{{it.count}}</span>
</button>
</sc-for>
<sc-if value="{{sec.hint}}" hint-placeholder-val="{{false}}">
<div style="padding: 2px 8px 2px 31px; font-size: 12px; color: {{t.ink3}};">{{sec.hint}}</div>
</sc-if>
</div>
</sc-for>
</div>

<div style="flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding-top: 8px; border-top: 1px solid {{t.line}};">
<button type="button" style="flex-grow: 1; height: 28px; border: 0; border-radius: 5px; background: transparent; color: {{t.ink2}}; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 8px; padding: 0 8px; cursor: pointer;"><svg width="15" height="15" style="color: {{t.ink3}};" aria-hidden="true"><use href="#s-gear"></use></svg>Settings</button>
<button type="button" aria-label="Sync is up to date" style="width: 28px; height: 28px; border: 0; border-radius: 5px; background: transparent; color: {{t.ink3}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" aria-hidden="true"><use href="#s-cloud"></use></svg></button>
<button type="button" aria-label="Switch to dark theme" style="width: 28px; height: 28px; border: 0; border-radius: 5px; background: transparent; color: {{t.ink3}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" aria-hidden="true"><use href="#s-moon"></use></svg></button>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"active":{"editor":"enum","options":["task-board","task-table","progress","inbox","meeting-table","weekly"],"default":"task-board"},"$preview":{"width":224,"height":900}}'>
class Component extends DCLogic {
  tokens(theme) {
    if (theme === "dark") {
      return { bg: "#111113", surface: "#18181B", ink: "#EDEDEF", ink2: "#B4B4BC", ink3: "#8E8E98", line: "#2A2A2F", sel: "#26262B" };
    }
    return { bg: "#F6F6F7", surface: "#FFFFFF", ink: "#18181B", ink2: "#52525B", ink3: "#6B6B73", line: "#E6E6E9", sel: "#E8E8EB" };
  }
  renderVals() {
    const theme = this.props.theme ?? "light";
    const active = this.props.active ?? "task-board";
    const t = this.tokens(theme);
    const it = (key, icon, label, count) => {
      const on = key === active;
      return { icon, label, count: count ? String(count) : "", bg: on ? t.sel : "transparent", ink: on ? t.ink : t.ink2, iconInk: on ? t.ink : t.ink3, weight: on ? "500" : "400" };
    };
    const sections = [
      { label: "", hint: "", items: [
        it("search", "search", "Search", "⌘K"), it("today", "today", "Today"), it("inbox", "inbox", "Inbox", 17), it("weekly", "review", "Weekly review"),
        it("graph", "graph", "Graph"), it("tags", "tag", "Tags"), it("automations", "bolt", "Automations"), it("activity", "pulse", "Activity"),
        it("templates", "template", "Templates"), it("terms", "terms", "Terms"),
      ] },
      { label: "Dashboards", hint: "", items: [it("progress", "chart", "Progress")] },
      { label: "Favorites", hint: "Star a note to keep it here", items: [] },
      { label: "Views", hint: "", items: [
        it("1on1", "table", "1on1’s Table"), it("all-notes", "gallery", "All Notes"), it("meeting-table", "table", "Meeting table"), it("next", "list", "Next actions"),
        it("person-gallery", "gallery", "Person gallery"), it("person-table", "table", "Person table"), it("someday", "table", "Someday and Longterm"),
        it("task-board", "board", "Task board"), it("task-table", "table", "Task table"), it("waiting", "list", "Waiting"),
      ] },
      { label: "Types", hint: "", items: [it("t-area", "folder", "Area"), it("t-artifact", "template", "Artifact", 1), it("t-company", "company", "Company", 25), it("t-meeting", "calendar", "Meeting"), it("t-person", "person", "Person"), it("t-task", "task", "Task")] },
    ];
    return { theme, t, sections };
  }
}
</script>
</body>
</html>
