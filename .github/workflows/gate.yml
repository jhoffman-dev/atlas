name: gate

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so the token is read-only, and no
# checkout leaves it behind in .git/config.
permissions:
  contents: read

# A new push to a pull request replaces the run before it. A run on `main` is
# never replaced: it is the one full run a docs-only pull request skipped. Each
# gets a group of its own, because a shared group also drops a run that is still
# waiting when a third arrives.
concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# How many machines each suite is split over, and the only place it is said: the
# `changes` job turns each into the list its matrix runs and the N in `--shard=i/N`.
env:
  UNIT_SHARDS: 3
  E2E_SHARDS: 4

defaults:
  run:
    # Named, so a failure on the left of a pipe fails the step (`-o pipefail`).
    shell: bash

# The slow work is split across machines: the unit tests over three, the
# end-to-end suite over four. `gate`, at the bottom, is the one check to require.
# Nothing requires it until it is added as a required status check to the
# "Protect main" ruleset, which is a repository setting and not this file.
#
# Actions from outside GitHub are pinned to a commit, with the version it was
# beside it: a tag can be moved to other code, a commit cannot.
#
# macOS: the account runs only five macOS jobs at once, and a full run uses
# exactly five (four end-to-end shards and `rust`). Add a sixth and it queues.

jobs:
  changes:
    # Decides whether the slow jobs are needed, and how they are split. A job
    # rather than a workflow-level `paths:` filter, because a workflow that never
    # starts never reports `gate`, and a required check that never reports blocks
    # the merge for good.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      unit-shards: ${{ steps.shards.outputs.unit }}
      unit-shard-total: ${{ steps.shards.outputs.unit-total }}
      e2e-shards: ${{ steps.shards.outputs.e2e }}
      e2e-shard-total: ${{ steps.shards.outputs.e2e-total }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # A pull request is checked out as its merge into the base, so the
          # first parent is the base and the diff between them is the change.
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Is this more than documentation?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD \
              | node tools/ci/changed-scope.mjs | tee -a "$GITHUB_OUTPUT"
          else
            echo code=true | tee -a "$GITHUB_OUTPUT"
          fi

      # A matrix cannot read `env`, so the counts reach it as this job's outputs.
      - name: Number the shards
        id: shards
        run: |
          {
            echo "unit=$(jq -nc --argjson total "$UNIT_SHARDS" '[range(1; $total + 1)]')"
            echo "unit-total=$UNIT_SHARDS"
            echo "e2e=$(jq -nc --argjson total "$E2E_SHARDS" '[range(1; $total + 1)]')"
            echo "e2e-total=$E2E_SHARDS"
          } | tee -a "$GITHUB_OUTPUT"

  static:
    # Everything that fails fast, and the only job a docs-only change still
    # runs: the formatter checks Markdown too.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Linux, because none of this needs macOS and macOS jobs are the scarce ones.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.unit-shards) }}
    name: unit (${{ matrix.shard }}/${{ needs.changes.outputs.unit-shard-total }})
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The sync tests merge with real git under an isolated HOME, so a merge
      # commit takes the identity git guesses from the machine: the account's
      # full name and the host's domain. A Mac has both; this runner has neither.
      - name: Give git a name and host to guess from, as a Mac does
        run: |
          sudo usermod --comment 'Atlas CI' "$(whoami)"
          sudo hostname "$(hostname).local"

      # A third of the tests cannot meet the coverage thresholds, so the shard
      # config leaves them out. What this shard covered goes into its blob, and
      # the `coverage` job holds the three together to the thresholds.
      - name: Test, a third of the suite
        run: >
          pnpm exec vitest run --config tools/ci/vitest.shard.config.ts
          --coverage --coverage.reporter=text-summary
          --shard=${{ matrix.shard }}/${{ needs.changes.outputs.unit-shard-total }}
          --reporter=default --reporter=blob

      - uses: actions/upload-artifact@v4
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    # Puts the three shards' coverage back together and holds it to the
    # thresholds in vitest.config.ts: the repo floor and each module's own.
    needs: [changes, unit]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: unit-blob-*
          path: .vitest/blob
          merge-multiple: true

      # Merging two blobs of three succeeds, and reports whatever those two
      # covered. Every file in the folder is one shard's blob, so count them.
      - name: Require a blob from every unit shard
        run: |
          found=$(find .vitest/blob -type f | wc -l | tr -d ' ')
          echo "blobs: $found of $UNIT_SHARDS"
          ls -l .vitest/blob
          if [ "$found" -ne "$UNIT_SHARDS" ]; then
            echo "::error::Expected $UNIT_SHARDS unit-shard blobs, found $found."
            exit 1
          fi

      - name: Merge coverage and enforce the thresholds
        run: pnpm exec vitest --merge-reports --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS because the Tauri shell links against WebKit.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # This action has no releases: its `master` branch is the action and its
      # other branches only name a toolchain, so the toolchain is named here.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Lint Rust shell
        run: pnpm rust:lint

      # The embedding model the Rust tests run (ADR-0031), 91 MB, kept between
      # runs under its pinned revision so a warm run never touches the network.
      # rust-cache does not keep target/tmp, where the tests fetch it otherwise.
      - name: Read the embedding model's revision
        id: embedding-model
        run: |
          revision=$(grep -m1 -o 'revision: "[0-9a-f]*"' apps/desktop/src-tauri/src/embeddings.rs | cut -d'"' -f2)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/atlas-test-models
          key: embedding-model-${{ steps.embedding-model.outputs.revision }}

      - name: Test Rust shell
        run: pnpm rust:test
        env:
          ATLAS_TEST_MODEL_DIR: ${{ runner.temp }}/atlas-test-models

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS because the end-to-end suite drives the same WebKit the Tauri window
    # uses. One worker per machine, as before; the four machines are the speed-up.
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e-shards) }}
    name: e2e (${{ matrix.shard }}/${{ needs.changes.outputs.e2e-shard-total }})
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: webkit
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit for end-to-end tests
        if: steps.webkit.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit

      # `pnpm e2e` builds first, here on the shard: the build takes seconds, and
      # handing `dist` over from another job would hold every shard back until
      # that job had installed and built.
      #
      # No `--trace=retain-on-failure`: tracing every test took the four shards
      # from 1114 s to 1479 s between them when it was measured (#113). A failed
      # shard uploads the HTML report and each failure's error context instead.
      - name: End-to-end, a quarter of the suite
        run: >
          pnpm e2e --shard=${{ matrix.shard }}/${{ needs.changes.outputs.e2e-shard-total }}
          --reporter=list,html

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  gate:
    # The one check to require (a ruleset setting; see the top). `always()` because a job skipped after a failed
    # dependency counts as passing, which would let a red run through. So a skip
    # is accepted only where `changes` asked for it: a docs-only change.
    needs: [changes, static, unit, coverage, rust, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that should have run to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          echo "code changed: ${CODE:-unknown}"
          jq -e --arg code "$CODE" '
            (if $code == "false" then "skipped" else "success" end) as $slow
            | .changes.result == "success"
              and .static.result == "success"
              and ([.unit, .coverage, .rust, .e2e] | all(.result == $slow))
          ' <<< "$NEEDS"
