name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Named, so a failure on the left of a pipe fails the step (`-o pipefail`).
    shell: bash

# The slow work is split across machines: the unit tests over three, the
# end-to-end suite over four, the response-time budgets on one more.
# `gate`, at the bottom, is the one check to require.
#
# macOS: the account runs only five macOS jobs at once, and a full run uses
# exactly five (four end-to-end shards and `rust`). Add a sixth and it queues.

jobs:
  changes:
    # Decides whether the slow jobs are needed. A job rather than a workflow-level
    # `paths:` filter, because a workflow that never starts never reports `gate`,
    # and a required check that never reports blocks the merge for good.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request is checked out as its merge into the base, so the
          # first parent is the base and the diff between them is the change.
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Is this more than documentation?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD \
              | node tools/ci/changed-scope.mjs | tee -a "$GITHUB_OUTPUT"
          else
            echo code=true | tee -a "$GITHUB_OUTPUT"
          fi

  static:
    # Everything that fails fast, and the only job a docs-only change still
    # runs: the formatter checks Markdown too.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Linux, because none of this needs macOS and macOS jobs are the scarce ones.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: unit (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The sync tests merge with real git under an isolated HOME, so a merge
      # commit takes the identity git guesses from the machine: the account's
      # full name and the host's domain. A Mac has both; this runner has neither.
      - name: Give git a name and host to guess from, as a Mac does
        run: |
          sudo usermod --comment 'Atlas CI' "$(whoami)"
          sudo hostname "$(hostname).local"

      # A third of the tests cannot meet the coverage thresholds, so the shard
      # config leaves them out. What this shard covered goes into its blob, and
      # the `coverage` job holds the three together to the thresholds.
      - name: Test, a third of the suite
        run: >
          pnpm exec vitest run --config tools/ci/vitest.shard.config.ts
          --coverage --coverage.reporter=text-summary
          --shard=${{ matrix.shard }}/3 --reporter=default --reporter=blob

      - uses: actions/upload-artifact@v4
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    # Puts the three shards' coverage back together and holds it to the
    # thresholds in vitest.config.ts: the repo floor and each module's own.
    needs: [changes, unit]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: unit-blob-*
          path: .vitest/blob
          merge-multiple: true

      - name: Merge coverage and enforce the thresholds
        run: pnpm exec vitest --merge-reports --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS because the Tauri shell links against WebKit.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Lint Rust shell
        run: pnpm rust:lint

      # The embedding model the Rust tests run (ADR-0031), 91 MB, kept between
      # runs under its pinned revision so a warm run never touches the network.
      # rust-cache does not keep target/tmp, where the tests fetch it otherwise.
      - name: Read the embedding model's revision
        id: embedding-model
        run: |
          revision=$(grep -m1 -o 'revision: "[0-9a-f]*"' apps/desktop/src-tauri/src/embeddings.rs | cut -d'"' -f2)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/atlas-test-models
          key: embedding-model-${{ steps.embedding-model.outputs.revision }}

      - name: Test Rust shell
        run: pnpm rust:test
        env:
          ATLAS_TEST_MODEL_DIR: ${{ runner.temp }}/atlas-test-models

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS because the end-to-end suite drives the same WebKit the Tauri window
    # uses. One worker per machine, as before; the four machines are the speed-up.
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: webkit
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit for end-to-end tests
        if: steps.webkit.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit

      # `pnpm e2e` builds first, here on the shard: the build takes seconds, and
      # handing `dist` over from another job would hold every shard back until
      # that job had installed and built.
      #
      # No `--trace=retain-on-failure`: tracing every test took the four shards
      # from 1114 s to 1479 s between them when it was measured (#113). A failed
      # shard uploads the HTML report and each failure's error context instead.
      - name: End-to-end, a quarter of the suite
        run: pnpm e2e --shard=${{ matrix.shard }}/4 --reporter=list,html

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # On the 2,000-note fixture vault: the response-time budgets (#217) for
    # filing from the Inbox and opening a note, and the work budgets
    # (`tools/perf/budgets.json`), counts of what each action makes the app
    # do. Linux, because macOS jobs are the scarce ones and WebKit runs here
    # too; the time budgets have headroom for it, and counts do not vary.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit

      # One build for both runs, unminified so the work budgets can name the
      # components that rendered. So the response-time budgets here time the
      # unminified bundle, not the shipped one: a little slower to parse, which
      # their headroom covers. `pnpm perf` locally builds minified, so its
      # times differ a little from this job's.
      - name: Build the frontend, keeping component names
        run: pnpm --filter @atlas/desktop exec vite build --minify false

      - name: Response times on the fixture vault
        run: pnpm exec playwright test --config playwright.perf.config.ts --project latency --reporter=list

      # Run even when a time budget failed, so a red run still says what the counts were.
      - name: Work budgets on the fixture vault
        if: success() || failure()
        run: pnpm exec playwright test --config playwright.perf.config.ts --project budgets --reporter=list
        env:
          # Counted twice: a count that differs between the two runs fails, so the
          # work clock stays proven deterministic on the runner, not only here.
          PERF_BUDGETS_RUNS: 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: |
            test-results/perf/
            test-results/**/error-context.md
          retention-days: 7

  gate:
    # The one check to require. `always()` because a job skipped after a failed
    # dependency counts as passing, which would let a red run through. So a skip
    # is accepted only where `changes` asked for it: a docs-only change.
    needs: [changes, static, unit, coverage, rust, e2e, perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that should have run to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          echo "code changed: ${CODE:-unknown}"
          jq -e --arg code "$CODE" '
            (if $code == "false" then "skipped" else "success" end) as $slow
            | .changes.result == "success"
              and .static.result == "success"
              and ([.unit, .coverage, .rust, .e2e, .perf] | all(.result == $slow))
          ' <<< "$NEEDS"
