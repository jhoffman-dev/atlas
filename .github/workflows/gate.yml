name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # macOS because the Tauri shell links against WebKit; the JS half would run anywhere.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build frontend
        run: pnpm build

      - name: Lint Rust shell
        run: pnpm rust:lint

      # The embedding model the Rust tests run (ADR-0031), 91 MB, kept between
      # runs under its pinned revision so a warm run never touches the network.
      # rust-cache does not keep target/tmp, where the tests fetch it otherwise.
      - name: Read the embedding model's revision
        id: embedding-model
        run: |
          revision=$(grep -m1 -o 'revision: "[0-9a-f]*"' apps/desktop/src-tauri/src/embeddings.rs | cut -d'"' -f2)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/atlas-test-models
          key: embedding-model-${{ steps.embedding-model.outputs.revision }}

      - name: Test Rust shell
        run: pnpm rust:test
        env:
          ATLAS_TEST_MODEL_DIR: ${{ runner.temp }}/atlas-test-models

      - name: Install WebKit for end-to-end tests
        run: pnpm exec playwright install --with-deps webkit

      - name: End-to-end smoke
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
