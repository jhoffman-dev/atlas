name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Linux, because the account runs only five macOS jobs at once and none of these need it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build frontend
        run: pnpm build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  macos:
    # macOS because the Tauri shell links against WebKit, and the end-to-end suite
    # drives the same WebKit the Tauri window uses.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Lint Rust shell
        run: pnpm rust:lint

      - name: Test Rust shell
        run: pnpm rust:test

      - name: Install WebKit for end-to-end tests
        run: pnpm exec playwright install --with-deps webkit

      - name: End-to-end smoke
        run: pnpm e2e

  gate:
    # The one check to require. `always()` because a job skipped after a failed
    # dependency counts as passing, which would let a red run through.
    needs: [checks, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          echo "checks: $CHECKS, macos: $MACOS"
          test "$CHECKS" = success && test "$MACOS" = success
