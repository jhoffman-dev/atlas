name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Linux, because the account runs only five macOS jobs at once and none of these need it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The sync tests merge with real git under an isolated HOME, so a merge
      # commit takes the identity git guesses from the machine: the account's
      # full name and the host's domain. A Mac has both; this runner has neither.
      - name: Give git a name and host to guess from, as a Mac does
        run: |
          sudo usermod --comment 'Atlas CI' "$(whoami)"
          sudo hostname "$(hostname).local"

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build frontend
        run: pnpm build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  macos:
    # macOS because the Tauri shell links against WebKit, and the end-to-end suite
    # drives the same WebKit the Tauri window uses.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Lint Rust shell
        run: pnpm rust:lint

      # The embedding model the Rust tests run (ADR-0031), 91 MB, kept between
      # runs under its pinned revision so a warm run never touches the network.
      # rust-cache does not keep target/tmp, where the tests fetch it otherwise.
      - name: Read the embedding model's revision
        id: embedding-model
        run: |
          revision=$(grep -m1 -o 'revision: "[0-9a-f]*"' apps/desktop/src-tauri/src/embeddings.rs | cut -d'"' -f2)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/atlas-test-models
          key: embedding-model-${{ steps.embedding-model.outputs.revision }}

      - name: Test Rust shell
        run: pnpm rust:test
        env:
          ATLAS_TEST_MODEL_DIR: ${{ runner.temp }}/atlas-test-models

      - name: Install WebKit for end-to-end tests
        run: pnpm exec playwright install --with-deps webkit

      - name: End-to-end smoke
        run: pnpm e2e

  gate:
    # The one check to require. `always()` because a job skipped after a failed
    # dependency counts as passing, which would let a red run through.
    needs: [checks, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          echo "checks: $CHECKS, macos: $MACOS"
          test "$CHECKS" = success && test "$MACOS" = success
